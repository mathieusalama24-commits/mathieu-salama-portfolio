<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Mathieu Salama — Création de sites web pour commerçants locaux</title>
    <meta
      name="description"
      content="7 sites déployés pour des commerçants locaux (Argenteuil, Cormeilles-en-Parisis, Val-d'Oise). React, TypeScript, Tailwind. Maquette gratuite, sans engagement."
    />
    <link rel="canonical" href="https://mathieu-salama.netlify.app/" />
    <meta name="theme-color" content="#0B0F14" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Mathieu Salama" />
    <meta
      property="og:title"
      content="Mathieu Salama — Création de sites web pour commerçants locaux"
    />
    <meta
      property="og:description"
      content="7 sites déployés pour des commerçants locaux, chacun construit sur des données réelles et vérifiées."
    />
    <meta property="og:image" content="/images/mathieu-salama.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Formulaire statique dupliqué pour la détection Netlify Forms au build
      (Netlify parse le HTML généré, pas le DOM React). Jamais affiché ni
      soumis : le vrai formulaire est dans DevisDrawer.tsx, posté en fetch.
    -->
    <form name="devis" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="nom" />
      <input type="email" name="email" />
      <input type="tel" name="telephone" />
      <input type="text" name="offre" />
      <input type="text" name="site-existant" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
